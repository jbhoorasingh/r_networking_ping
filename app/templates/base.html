{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reachability Console{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    <div class="background-glow glow-a"></div>
    <div class="background-glow glow-b"></div>
    <header class="app-header">
        <div class="title-wrap">
            <p class="eyebrow">Network Visibility</p>
            <h1>Reachability Console</h1>
        </div>
        <div class="header-right">
            <nav class="top-nav">
                <a class="nav-link{% if active_page == 'hosts' %} active{% endif %}" href="/">Hosts</a>
                <a class="nav-link{% if active_page == 'results' %} active{% endif %}" href="/results/">All Results</a>
            </nav>
            <div class="refresh-chip">
                <span>Last refresh</span>
                <strong id="last-refresh">Not yet loaded</strong>
            </div>
        </div>
    </header>
    <main class="app-main">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
