services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./.db.env
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-r_networking_ping} -d ${POSTGRES_DB:-r_networking_ping}"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m

  web:
    build:
      context: ./app
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    env_file:
      - ./app/.env
      - ./.db.env
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      SQL_ENGINE: django.db.backends.postgresql
      SQL_HOST: db
      SQL_PORT: "5432"
      SQL_DATABASE: ${POSTGRES_DB:-r_networking_ping}
      SQL_USER: ${POSTGRES_USER:-r_networking_ping}
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-HelloW0rld2023!}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    mem_limit: 768m

  worker:
    build:
      context: ./app
    command: python -m r_networking_ping.celery_compat -A r_networking_ping worker --loglevel=info
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    env_file:
      - ./app/.env
      - ./.db.env
    environment:
      SQL_ENGINE: django.db.backends.postgresql
      SQL_HOST: db
      SQL_PORT: "5432"
      SQL_DATABASE: ${POSTGRES_DB:-r_networking_ping}
      SQL_USER: ${POSTGRES_USER:-r_networking_ping}
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-HelloW0rld2023!}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PING_DISPATCH_ASYNC: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m

  beat:
    build:
      context: ./app
    command: python -m r_networking_ping.celery_compat -A r_networking_ping beat --loglevel=info
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    env_file:
      - ./app/.env
      - ./.db.env
    environment:
      SQL_ENGINE: django.db.backends.postgresql
      SQL_HOST: db
      SQL_PORT: "5432"
      SQL_DATABASE: ${POSTGRES_DB:-r_networking_ping}
      SQL_USER: ${POSTGRES_USER:-r_networking_ping}
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-HelloW0rld2023!}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m

  flower:
    build:
      context: ./app
    command: python -m r_networking_ping.celery_compat -A r_networking_ping flower --port=5555 --loglevel=info
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    env_file:
      - ./app/.env
      - ./.db.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    profiles:
      - observability
    mem_limit: 256m

volumes:
  postgres_dev_data:
  redis_dev_data:
